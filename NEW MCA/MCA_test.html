<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MCA — Middle East Combat Arena</title>
<style>
  :root { --accent:#c8a23a; --accent-dim:rgba(200,162,58,0.35); }
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0c10;
    font:13px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif; color:#dfe6f2; }
  #game { position:fixed; inset:0; display:block; cursor:crosshair; }

  .panel { background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    border-radius:5px; }
  .micro { font-size:9px; text-transform:uppercase; letter-spacing:0.14em;
    color:#7d8797; }

  /* dim the chrome while placing a structure */
  body.placing #topbar, body.placing #buildbar,
  body.placing #minimap, body.placing #sel-panel {
    opacity:0.35; transition:opacity 0.15s; }
  #topbar, #buildbar, #minimap, #sel-panel { transition:opacity 0.15s; }
  /* crosshair feedback while targeting an ability / attack-move */
  body.targeting #game, body.attackmove #game { cursor:cell; }
  /* capture feedback: engineer hovering a hostile/neutral structure */
  body.capture #game { cursor:copy; }

  /* hide all in-match HUD chrome while a menu overlay owns the screen */
  body.in-menu #topbar, body.in-menu #buildbar, body.in-menu #minimap,
  body.in-menu #sel-panel, body.in-menu #hint, body.in-menu #tooltip,
  body.in-menu #cursor-label { display:none; }

  /* ---- slim top bar ---- */
  #topbar { position:fixed; top:0; left:0; right:0; height:36px; z-index:5;
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background:rgba(12,14,18,0.85); border-bottom:1px solid var(--accent-dim);
    user-select:none; }
  .tb-label { font-size:9px; text-transform:uppercase; letter-spacing:0.14em;
    color:#7d8797; }
  .tb-credits { color:#ffd76a; font-weight:600; font-size:14px; min-width:48px; }
  .tb-val { color:#cfd6e2; font-size:12px; font-variant-numeric:tabular-nums; }
  .tb-power { display:inline-flex; align-items:center; }
  .tb-power-dot { width:8px; height:8px; border-radius:50%; display:inline-block;
    margin-right:5px; }
  .tb-power-dot.ok { background:#4caf50; }
  .tb-power-dot.amber { background:#ffb300; }
  .tb-power-dot.low { background:#e53935; box-shadow:0 0 6px #e53935; }
  .tb-spacer { flex:1; }
  .tb-btn { background:transparent; border:1px solid #2a2f3a; color:#aab4c4;
    padding:3px 10px; border-radius:4px; cursor:pointer; font-size:10px;
    text-transform:uppercase; letter-spacing:0.08em; font-family:inherit; }
  .tb-btn:hover { border-color:var(--accent); color:#fff; }
  .tb-btn.active { background:var(--accent-dim); color:#fff;
    border-color:var(--accent); }

  /* ---- bottom-center build bar ---- */
  #buildbar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:5; background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    border-radius:6px; padding:6px 8px 8px; user-select:none; max-width:72vw; }
  .bb-tabs { display:flex; gap:3px; margin-bottom:6px; }
  .bb-tab { padding:4px 12px; font-size:10px; text-transform:uppercase;
    letter-spacing:0.12em; color:#8a94a6; background:transparent;
    border:1px solid #232833; border-radius:4px; cursor:pointer;
    font-family:inherit; }
  .bb-tab:hover { color:#dfe6f2; }
  .bb-tab.active { color:#fff; border-color:var(--accent);
    background:rgba(255,255,255,0.06); }
  .bb-page { align-self:center; margin-left:auto; font-size:10px; color:#8a94a6;
    text-transform:uppercase; letter-spacing:0.1em; }
  .bb-row { display:flex; gap:8px; align-items:stretch; }
  .bb-grid { display:flex; flex-wrap:wrap; gap:5px; }
  .bb-tile { position:relative; width:60px; height:64px; background:#14171d;
    border:1px solid #262c38; border-radius:5px; cursor:pointer; color:#dfe6f2;
    display:flex; align-items:center; justify-content:center; padding:0;
    overflow:hidden; font-family:inherit; }
  .bb-tile:hover { border-color:var(--accent); }
  .bb-tile.disabled { opacity:0.38; cursor:not-allowed; }
  .bb-tile.ready { border-color:#4caf50; box-shadow:0 0 6px rgba(76,175,80,0.35); }
  .bb-tile.queued { border-color:#ffb300; }
  .bb-tile.placing { border-color:#4caf50; background:rgba(76,175,80,0.12); }
  .bb-hotkey { position:absolute; top:2px; left:4px; font-size:9px;
    color:#8a94a6; z-index:2; }
  .bb-glyph { position:relative; width:26px; height:26px; display:flex;
    align-items:center; justify-content:center; }
  .bb-shape { position:absolute; inset:0; background:var(--accent);
    border-radius:3px; }
  .bb-shape.shape-circle { border-radius:50%; }
  .bb-shape.shape-triangle { clip-path:polygon(50% 0, 100% 100%, 0 100%);
    border-radius:0; }
  .bb-shape.shape-diamond { transform:rotate(45deg) scale(0.8); }
  /* structure silhouettes (shared by build tiles + selection glyphs) */
  .shape-octagon { clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,
    30% 100%,0 70%,0 30%); border-radius:0; }
  .shape-hexagon { clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,
    0 50%); border-radius:0; }
  .shape-barrel { border-radius:35%; }
  .shape-chevron { clip-path:polygon(50% 0,100% 50%,80% 100%,20% 100%,0 50%);
    border-radius:0; }
  .shape-runway { clip-path:polygon(20% 0,80% 0,65% 100%,35% 100%);
    border-radius:0; }
  .shape-dock { clip-path:polygon(0 0,100% 0,100% 60%,70% 100%,30% 100%,0 60%);
    border-radius:0; }
  .shape-bunker { clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%);
    border-radius:0; }
  .shape-spike { clip-path:polygon(50% 0,70% 60%,100% 100%,0 100%,30% 60%);
    border-radius:0; }
  .shape-radar { clip-path:polygon(50% 0,93% 25%,100% 60%,70% 60%,70% 100%,
    30% 100%,30% 60%,0 60%,7% 25%); border-radius:0; }
  .shape-star, .shape-star-sw { clip-path:polygon(50% 0,61% 35%,98% 35%,
    68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); border-radius:0; }
  .bb-initials { position:relative; font-size:10px; font-weight:700;
    color:#0c0e12; }
  .bb-cost { position:absolute; bottom:2px; right:4px; font-size:9px;
    color:#ffd76a; z-index:2; }
  .bb-tile.ready .bb-cost { color:#9f9; }
  .bb-badge { position:absolute; top:2px; right:4px; font-size:9px;
    background:#ffb300; color:#111; border-radius:6px; padding:0 4px; z-index:2; }
  .bb-prog { position:absolute; inset:0; pointer-events:none; z-index:1; }
  .bb-actions { display:flex; flex-direction:column; gap:5px;
    justify-content:center; min-width:132px; border-left:1px solid #232833;
    padding-left:8px; }
  .bb-action { background:#14171d; border:1px solid #2a2f3a; color:#cfd6e2;
    border-radius:5px; padding:8px 10px; cursor:pointer; font-size:11px;
    text-transform:uppercase; letter-spacing:0.08em; font-family:inherit; }
  .bb-action:hover { border-color:var(--accent); color:#fff; }
  .bb-action.disabled { opacity:0.45; cursor:not-allowed; }
  .bb-action.ready { border-color:#4caf50; color:#9f9; }
  .bb-action.placing { border-color:var(--accent); background:rgba(255,255,255,0.06); }
  .bb-deploy { font-size:14px; font-weight:700; padding:14px 10px;
    border-color:#4caf50; color:#9f9; animation:bb-pulse 1.2s infinite; }
  @keyframes bb-pulse {
    0%,100% { box-shadow:0 0 4px rgba(76,175,80,0.4); }
    50% { box-shadow:0 0 16px rgba(76,175,80,0.9); }
  }

  /* ---- selection panel (bottom-left, above minimap) ---- */
  #sel-panel { position:fixed; left:10px; bottom:198px; min-width:220px;
    max-width:300px; max-height:170px; overflow-y:auto; z-index:5;
    background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    border-radius:5px; padding:6px 8px; font-size:12px; user-select:none; }
  #sel-panel:empty { display:none; }
  .sel-row { display:flex; align-items:center; gap:6px; padding:2px 0;
    white-space:nowrap; }
  .sel-glyph { width:18px; height:18px; border-radius:3px; flex:none;
    background:var(--accent); color:#0c0e12; font-size:8px; font-weight:700;
    display:flex; align-items:center; justify-content:center; }
  .sel-name { color:#dfe6f2; }
  .sel-hp { color:#8f8; font-size:10px; font-variant-numeric:tabular-nums; }
  .sel-hpbar { width:56px; height:4px; background:#222; border-radius:2px;
    overflow:hidden; display:inline-block; }
  .sel-hpbar > span { display:block; height:100%; background:#4caf50; }
  .sel-tip { color:#7d8797; font-size:10px; text-transform:uppercase;
    letter-spacing:0.1em; padding-top:4px; }

  /* ---- minimap bottom-left ---- */
  #minimap { position:fixed; left:10px; bottom:10px; width:220px; height:180px;
    background:#000; border:1px solid var(--accent-dim); border-radius:5px;
    overflow:hidden; z-index:5; }
  #minimap canvas { width:100%; height:100%; display:block; cursor:pointer; }

  /* ---- hint banners top-center ---- */
  #hint { position:fixed; top:46px; left:50%; transform:translateX(-50%);
    z-index:6; display:flex; flex-direction:column; gap:6px; align-items:center;
    pointer-events:none; }
  .hint-banner { background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    color:#dfe6f2; padding:6px 14px; border-radius:5px; font-size:12px;
    letter-spacing:0.04em; animation:hb-in 0.25s ease-out;
    transition:opacity 0.6s; }
  .hint-banner.mcv { border-color:var(--accent); color:#ffd76a; }
  .hint-banner.fade { opacity:0; }
  @keyframes hb-in { from { opacity:0; transform:translateY(-6px); }
    to { opacity:1; transform:none; } }

  /* ---- red reason label at cursor ---- */
  #cursor-label { position:fixed; pointer-events:none; z-index:8;
    background:rgba(30,10,10,0.9); border:1px solid #e53935; color:#ff8a80;
    padding:3px 8px; font-size:10px; border-radius:4px; opacity:0;
    text-transform:uppercase; letter-spacing:0.08em; }
  #cursor-label.flash { animation:cl-flash 1.4s ease-out forwards; }
  @keyframes cl-flash { 0% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; } }

  /* ---- tooltip ---- */
  #tooltip { position:fixed; z-index:9; background:rgba(12,14,18,0.95);
    border:1px solid var(--accent-dim); border-radius:5px; padding:8px 10px;
    font-size:11px; pointer-events:none; display:none; max-width:250px; }
  #tooltip .tt-name { color:#fff; font-weight:600; margin-bottom:2px; }
  #tooltip .tt-line { color:#9aa5b5; }
  #tooltip .tt-line:last-child { color:#ffb300; }

  #menu, #banner { position:fixed; inset:0; background:rgba(8,10,13,0.97);
    z-index:10; overflow-y:auto; padding:40px; }
  #menu.hidden, #banner.hidden { display:none; }
  .menu-box { max-width:780px; margin:0 auto; background:rgba(12,14,18,0.6);
    border:1px solid var(--accent-dim); border-radius:8px; padding:24px 28px; }
  .menu-box h1 { color:#fff; margin:0 0 4px; letter-spacing:0.04em;
    font-size:26px; }
  .menu-box h1 .acc { color:var(--accent); }
  .menu-box p { color:#8a94a6; margin:0 0 10px; font-size:12px;
    text-transform:uppercase; letter-spacing:0.12em; }
  .menu-box h2 { color:#8a94a6; margin:18px 0 6px; font-size:11px;
    text-transform:uppercase; letter-spacing:0.14em; font-weight:600; }
  .menu-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;
    align-items:center; }
  .menu-btn { background:#14171d; border:1px solid #2a2f3a; color:#cfd6e2;
    padding:8px 16px; cursor:pointer; font-size:12px; border-radius:5px;
    text-transform:uppercase; letter-spacing:0.1em; font-family:inherit; }
  .menu-btn:hover { border-color:var(--accent); color:#fff; }
  .menu-btn.sel { border-color:var(--accent); color:#fff;
    background:var(--accent-dim); }
  .fac-btn { width:230px; text-align:left; padding:8px 10px;
    text-transform:none; letter-spacing:0.02em; }
  .fac-btn .sw { display:inline-block; width:12px; height:12px;
    margin-right:6px; vertical-align:middle; border-radius:3px; }
  .fac-btn .ident { display:block; font-size:10px; color:#8a94a6;
    text-transform:uppercase; letter-spacing:0.08em; margin-top:2px; }
  .fac-btn .perk { display:block; font-size:9px; color:#6f7a8c; margin-top:2px; }
  .menu-btn.start { background:rgba(76,175,80,0.15); border-color:#4caf50;
    color:#9f9; font-size:14px; padding:10px 26px; }
  .menu-btn.start:hover { background:rgba(76,175,80,0.28); }
  .menu-box select, .menu-box input { background:#14171d; color:#dfe6f2;
    border:1px solid #2a2f3a; border-radius:4px; padding:5px; font-family:inherit; }
  .menu-box input[type=checkbox] { accent-color:var(--accent); }
  #banner { background:rgba(8,10,13,0.9); }
  #banner .menu-box { background:transparent; border:none; }
  #banner h1 { font-size:52px; text-align:center; margin-top:18vh;
    letter-spacing:0.12em; }
  #banner .menu-row { justify-content:center; }
  #banner.won h1 { color:#7c7; text-shadow:0 0 24px rgba(76,175,80,0.5); }
  #banner.lost h1 { color:#e66; text-shadow:0 0 24px rgba(229,57,53,0.5); }
</style>

// Camera: pan (arrows / screen edge / middle-drag), wheel zoom clamped,
// world<->screen transforms. x,y = world coords shown at screen top-left.
function createCamera(viewW, viewH) {
  return {
    x: 0, y: 0, zoom: 1,
    minZoom: 0.35, maxZoom: 2.5,
    viewW, viewH,
  };
}

function screenToWorld(cam, sx, sy) {
  return { x: sx / cam.zoom + cam.x, y: sy / cam.zoom + cam.y };
}

function worldToScreen(cam, wx, wy) {
  return { x: (wx - cam.x) * cam.zoom, y: (wy - cam.y) * cam.zoom };
}

// pan by screen-pixel delta
function panCameraBy(cam, dxPx, dyPx) {
  cam.x += dxPx / cam.zoom;
  cam.y += dyPx / cam.zoom;
}

// zoom anchored at the cursor position
function zoomCameraAt(cam, factor, sx, sy) {
  const nz = Math.max(cam.minZoom, Math.min(cam.maxZoom, cam.zoom * factor));
  if (!isFinite(nz) || nz <= 0 || nz === cam.zoom) return;
  const wx = sx / cam.zoom + cam.x;
  const wy = sy / cam.zoom + cam.y;
  cam.zoom = nz;
  cam.x = wx - sx / nz;
  cam.y = wy - sy / nz;
  if (!isFinite(cam.x) || !isFinite(cam.y)) { cam.x = wx; cam.y = wy; }
}

function clampCameraToMap(cam, worldW, worldH) {
  const vw = cam.viewW / cam.zoom;
  const vh = cam.viewH / cam.zoom;
  const mx = Math.max(0, worldW - vw);
  const my = Math.max(0, worldH - vh);

  if (cam.y < 0) cam.y = 0;
  if (cam.x > mx) cam.x = mx;
  if (cam.y > my) cam.y = my;
}

function centerCameraOn(cam, wx, wy) {
  cam.x = wx - cam.viewW / cam.zoom / 2;
  cam.y = wy - cam.viewH / cam.zoom / 2;
}

exports.createCamera = createCamera;
exports.screenToWorld = screenToWorld;
exports.worldToScreen = worldToScreen;
exports.panCameraBy = panCameraBy;
exports.zoomCameraAt = zoomCameraAt;

// tabs available from standing structures
function tabsFor(state, slot) {
  const has = (structId) => Object.values(state.structures)
    .some((s) => s.owner === slot && s.defId === structId);
  return TABS.filter((t) => (t.id === 'structures' ? has('SH-01') : has(t.prod)));
}

// items shown in a build-bar tab, in grid order
function buildGridItems(state, player, tabId) {
  const items = [];
  if (tabId === 'structures') {
    for (const def of state.data.structures) {
      if (def.faction !== 'All' && def.faction !== player.faction) continue;
      // ConYard rebuild tile: only while the rebuild is actually legal —
      // no CY standing, no MCV alive, one-shot not yet spent
      if (def.id === 'SH-01'
        && (hasConyard(state, player.slot) || hasMcv(state, player.slot) || player.cyRebuilt)) continue;
      items.push({ kind: 'struct', id: def.id });
    }
  } else {
    const tab = TABS.find((t) => t.id === tabId);
    if (!tab) return items;
    for (const def of state.data.units) {
      if (def.faction !== player.faction) continue;
      if (requiredProducer(state.unitDefs[def.id]) !== tab.prod) continue;
      items.push({ kind: 'unit', id: def.id });
    }
    // the harvester is a synthetic def (not in the sheet) — offer it at the WF
    if (tab.prod === 'SH-05') items.push({ kind: 'unit', id: 'HARV' });
  }
  return items;
}

// hotkey -> defId for a grid's items (Q W E R T F G, in grid order)
function hotkeyMapFor(items) {
  const m = {};
  items.forEach((it, i) => {
    if (i < BUILD_HOTKEYS.length) m[BUILD_HOTKEYS[i]] = it.id;
  });
  return m;
}

// tooltip content lines: name, cost/time/HP, role/counter or power/unlocks
function tooltipLines(state, player, kind, defId) {
  if (kind === 'struct') {
    const def = state.structDefs[defId];
    const cost = buildCost(state, player, def);
    const lines = [structureLabel(defId, player.faction, def.name),
      'Cost ' + cost + ' · Build ' + def.build_s + 's · ' + def.hp + ' HP'];
    if (def.power_out > 0) lines.push('Power +' + def.power_out);
    else if (def.power_use > 0) lines.push('Power -' + def.power_use);
    if (def.unlocks) lines.push(def.unlocks);
    return lines;
  }
  const def = state.unitDefs[defId];
  const cost = trainCost(state, player, def, requiredProducer(def) || 'SH-05');
  const lines = [unitHud(defId, def.name),
    'Cost ' + cost + ' · Build ' + def.build_s + 's · ' + def.hp + ' HP'];
  lines.push(def.role + (def.hardCounter ? ' — beaten by (hard): ' + def.hardCounter : ''));
  if (def.softCounter) lines.push('Threatened by (soft): ' + def.softCounter);
  if (def.cls === 'Engineer') lines.push('Captures enemy structures — order it to attack one');
  return lines;
}

// ---- DOM --------------------------------------------------------------------

function h(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

function hudPushCmd(game, cmd) {
  cmd.player = game.playerSlot;
  game.pendingCmds.push(cmd);
}

function initHud(game) {
  // top bar
  const top = document.getElementById('topbar');
  top.innerHTML = '';
  const creditsEl = h('span', 'tb-credits', '0');
  const powerDot = h('span', 'tb-power-dot ok');
  const powerEl = h('span', 'tb-val', '0 / 0');
  const clockEl = h('span', 'tb-val', '0:00');
  top.appendChild(h('span', 'tb-label', 'Credits'));
  top.appendChild(creditsEl);
  top.appendChild(h('span', 'tb-label', 'Power'));
  const pw = h('span', 'tb-power');
  pw.appendChild(powerDot);
  pw.appendChild(powerEl);
  top.appendChild(pw);
  top.appendChild(h('span', 'tb-label', 'Time'));
  top.appendChild(clockEl);
  top.appendChild(h('span', 'tb-spacer'));

  const speedBtns = {};
  for (const s of [1, 2, 4]) {
    const b = h('button', 'tb-btn' + (s === 1 ? ' active' : ''), s + 'x');
    b.addEventListener('click', () => {
      if (game.overlay) return; // an overlay owns the UI right now
      game.speed = s; game.paused = false;
      refreshSpeed();
    });
    speedBtns[s] = b;
    top.appendChild(b);
  }
  const pauseBtn = h('button', 'tb-btn', 'Pause');
  pauseBtn.addEventListener('click', () => {
    if (game.overlay) return; // paused overlay owns the pause state
    game.paused = !game.paused;
    refreshSpeed();
  });
  top.appendChild(pauseBtn);
  const menuBtn = h('button', 'tb-btn', 'Menu');
  menuBtn.addEventListener('click', () => { if (game.openMenu) game.openMenu(); });
  top.appendChild(menuBtn);
  function refreshSpeed() {
    for (const s of [1, 2, 4]) {
      speedBtns[s].classList.toggle('active', !game.paused && game.speed === s);
    }
    pauseBtn.classList.toggle('active', game.paused);
  }
  game.hudSyncSpeed = refreshSpeed; // main.js syncs after overlay-driven changes

  // build bar
  const bar = document.getElementById('buildbar');
  bar.innerHTML = '';
  const tabs = h('div', 'bb-tabs');
  const row = h('div', 'bb-row');
  const grid = h('div', 'bb-grid');
  const actions = h('div', 'bb-actions');
  row.appendChild(grid);
  row.appendChild(actions);
  bar.appendChild(tabs);
  bar.appendChild(row);

  // hint banners (persistent MCV hint is the first child)
  const hintRoot = document.getElementById('hint');
  hintRoot.innerHTML = '';
  const hintMcv = h('div', 'hint-banner mcv',
    'Select your MCV — press D or double-click it to deploy the Construction Yard');
  hintMcv.style.display = 'none';
  hintRoot.appendChild(hintMcv);

  game.hud = {
    creditsEl, powerDot, powerEl, clockEl, tabs, grid, actions,
    activeTab: 'structures', tiles: {}, tabSig: '', gridSig: '', actSig: '',
    stateRef: null, knownStructs: {}, lastReadyCount: 0, lastFaction: null, hintMcv,
    page: 0, hitSeen: {}, hitPing: {},
  };
  game.hudFocusBuild = () => {
    game.hud.activeTab = 'structures';
    game.hud.tabSig = '';
    updateHud(game);
  };
  game.hudNextPage = () => {
    const st2 = game.state;
    if (!st2) return;
    const p2 = st2.players[game.playerSlot];
    const count = buildGridItems(st2, p2, game.hud.activeTab).length;
    const pages = Math.max(1, Math.ceil(count / BUILD_HOTKEYS.length));
    game.hud.page = (game.hud.page + 1) % pages;
    game.hud.tabSig = '';
    updateHud(game);
  };
  game.hudKeyPress = (key) => hudKeyPress(game, key);
  game.hint = hintRoot;
}

function updateHud(game) {
  const st = game.state;
  if (!st || !game.hud) return;
  const p = st.players[game.playerSlot];
  const H = game.hud;
  if (H.stateRef !== st) {
    H.stateRef = st;
    H.knownStructs = {};
    H.lastReadyCount = 0;
    H.lastFaction = null;
    H.tabSig = ''; H.gridSig = ''; H.actSig = '';
    H.page = 0; H.hitSeen = {}; H.hitPing = {};
  }

  // faction accent once per match
  if (H.lastFaction !== p.faction) {
    H.lastFaction = p.faction;
    const col = factionColorOf(st.data, p.faction);
    const doc = document.documentElement;
    if (doc && doc.style && typeof doc.style.setProperty === 'function') {
      doc.style.setProperty('--accent', col);
      doc.style.setProperty('--accent-dim', col + '59');
    }
  }

  // top bar
  H.creditsEl.textContent = Math.floor(p.credits) + '';
  const ratio = p.powerOut > 0 ? p.powerUse / p.powerOut : 0;
  H.powerDot.className = 'tb-power-dot ' + (p.lowPower ? 'low' : ratio > 0.8 ? 'amber' : 'ok');
  H.powerEl.textContent = p.powerUse + ' / ' + p.powerOut;
  H.clockEl.textContent = fmtClock(st.tick);

  // dim the chrome while placing / targeting / attack-moving
  if (document.body && document.body.classList) {
    document.body.classList.toggle('placing', !!game.placement);
    document.body.classList.toggle('targeting', !!game.targeting);
    document.body.classList.toggle('attackmove', !!game.attackMoveArmed);
    // capture cursor: engineer selected and hovering a hostile/neutral structure
    let capCursor = false;
    if (game.mouse && game.mouse.inside && game.selection.some((id) => {
      const u = st.units[id];
      return u && u.owner === p.slot && st.unitDefs[u.defId].cls === 'Engineer';
    })) {
      const w = screenToWorld(game.camera, game.mouse.sx, game.mouse.sy);
      const cx = Math.floor(w.x / CELL), cy = Math.floor(w.y / CELL);
      capCursor = Object.values(st.structures).some((s) => isHostile(st, p.slot, s)
        && cx >= s.cx && cx < s.cx + s.fp && cy >= s.cy && cy < s.cy + s.fp);
    }
    document.body.classList.toggle('capture', capCursor);
  }

  // persistent deploy hint until the first ConYard exists
  let hasCy = false, hasMcv = false;
  for (const id in st.structures) {
    const s = st.structures[id];
    if (s.owner === p.slot && s.defId === 'SH-01') hasCy = true;
  }
  for (const id in st.units) {
    const u = st.units[id];
    if (u.owner === p.slot && u.defId === 'MCV') hasMcv = true;
  }
  H.hintMcv.style.display = (!hasCy && hasMcv && !st.over) ? 'block' : 'none';

  // structure finished construction -> hint + minimap ping at the base
  if (p.ready.length > H.lastReadyCount) {
    const newId = p.ready[p.ready.length - 1];
    showHint(game, structureLabel(newId, p.faction, st.structDefs[newId].name)
      + ' ready — place it from the build bar');
    const core = standingStructs(st, p.slot, (s) => st.structDefs[s.defId].type === 'Core')[0];
    if (core) {
      const c = structCenter(core);
      addPing(game, c.x, c.y);
    }
  }
  H.lastReadyCount = p.ready.length;

  // v0.3.4: brief toast when the player tried to deploy into a blocked spot
  if (p._deployFailTick && st.tick - p._deployFailTick <= 3) {
    p._deployFailTick = 0;
    showHint(game, 'No room to deploy — move the MCV a few cells and try again');
  }

  // newly placed structures -> minimap ping; production structures switch tab
  // (rally points are sim-side now: setRally command or defaultRallyCell)
  for (const id in st.structures) {
    const s = st.structures[id];
    if (s.owner !== p.slot || H.knownStructs[id]) continue;
    H.knownStructs[id] = 1;
    const c = structCenter(s);
    addPing(game, c.x, c.y);
    const tabId = PRODUCER_TAB[s.defId];
    if (tabId) {
      H.activeTab = tabId;
      H.tabSig = '';
      showHint(game, structureLabel(s.defId, p.faction, st.structDefs[s.defId].name)
        + ' online — ' + tabId + ' production available');
    }
  }

  // under-attack ping: own structure took a hit since last seen (throttled)
  for (const id in st.structures) {
    const s = st.structures[id];
    if (s.owner !== p.slot || s.lastHitTick < 0) continue;
    if (H.hitSeen[id] === s.lastHitTick) continue;
    H.hitSeen[id] = s.lastHitTick;
    if (st.tick - (H.hitPing[id] || -999) >= 20) {
      H.hitPing[id] = st.tick;
      const c = structCenter(s);
      addPing(game, c.x, c.y);
    }
  }

  updateTabs(game, p);
  updateGrid(game, p);
  updateActions(game, p);
  updateSelectionPanel(game, st);
}

function fmtClock(tick) {
  const s = Math.floor(tick / 10);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function hasConyard(st, slot) {
  for (const id in st.structures) {
    const s = st.structures[id];
    if (s.owner === slot && s.defId === 'SH-01') return true;
  }
  return false;
}

function hasMcv(st, slot) {
  for (const id in st.units) {
    const u = st.units[id];
    if (u.owner === slot && u.defId === 'MCV') return true;
  }
  return false;
}

// ---- build bar ---------------------------------------------------------------

function updateTabs(game, p) {
  const H = game.hud;
  const avail = tabsFor(game.state, p.slot);
  if (!avail.some((t) => t.id === H.activeTab)) {
    H.activeTab = avail.length ? avail[0].id : 'structures';
    H.page = 0;
  }
  const count = buildGridItems(game.state, p, H.activeTab).length;
  const pages = Math.max(1, Math.ceil(count / BUILD_HOTKEYS.length));
  if (H.page >= pages) H.page = pages - 1;
  const sig = avail.map((t) => t.id).join(',') + '|' + H.activeTab
    + '|' + H.page + '|' + pages;
  if (sig === H.tabSig) return;
  H.tabSig = sig;
  H.gridSig = '';
  H.tabs.innerHTML = '';
  for (const t of avail) {
    const b = h('button', 'bb-tab' + (t.id === H.activeTab ? ' active' : ''), t.label);
    b.addEventListener('click', () => {
      H.activeTab = t.id;
      H.page = 0;
      H.tabSig = '';
      updateHud(game);
    });
    H.tabs.appendChild(b);
  }
  if (pages > 1) {
    H.tabs.appendChild(h('span', 'bb-page', 'page ' + (H.page + 1) + '/' + pages + ' [Tab]'));
  }
}

// per-item display state, computed fresh each tick
function gridItemMeta(game, p, it) {
  const st = game.state;
  if (it.kind === 'struct') {
    const def = st.structDefs[it.id];
    const bs = structureButtonState(st, p, it.id);
    let queued = 0, progress = -1;
    p.buildQueue.forEach((q, i) => {
      if (q.structId !== it.id) return;
      queued++;
      if (i === 0) progress = q.progress / q.total;
    });
    return {
      kind: 'struct', id: it.id, def, cost: buildCost(st, p, def),
      enabled: bs.enabled, reason: bs.reason, queued,
      ready: p.ready.includes(it.id), progress,
    };
  }
  const tab = TABS.find((t) => t.id === game.hud.activeTab);
  const def = st.unitDefs[it.id];
  const bs = trainButtonState(st, p, it.id);
  let queued = 0, progress = -1;
  for (const id in st.structures) {
    const s = st.structures[id];
    if (s.owner !== p.slot || !tab || s.defId !== tab.prod) continue;
    for (let i = 0; i < s.queue.length; i++) {
      const q = s.queue[i];
      if (q.unitId !== it.id) continue;
      queued++;
      if (i === 0) progress = q.progress / q.total;
    }
  }
  return {
    kind: 'unit', id: it.id, def, cost: trainCost(st, p, def, tab ? tab.prod : null),
    enabled: bs.enabled, reason: bs.reason, queued, ready: false, progress,
  };
}

function reasonText(m) {
  if (m.ready) return 'Ready — click, then click the map (Shift chains placement)';
  if (m.enabled) return '';
  switch (m.reason) {
    case 'credits': return 'Not enough credits';
    case 'tech-gate': return 'Requires Command / Tech (SH-08)';
    case 'no-producer': return 'Requires production structure';
    case 'no-conyard': return 'Requires Construction Yard';
    case 'no-unique': return 'Requires the faction unique / superweapon structure';
    case 'cy-exists': return 'Construction Yard already standing';
    case 'cy-rebuild-used': return 'ConYard rebuild already used';
    case 'mcv-alive': return 'Deploy or lose your MCV first';
    case 'no-water': return 'No water on this map';
    default: return m.reason || '';
  }
}

function updateGrid(game, p) {
  const H = game.hud;
  const all = buildGridItems(game.state, p, H.activeTab);
  const items = all.slice(H.page * BUILD_HOTKEYS.length,
    (H.page + 1) * BUILD_HOTKEYS.length);
  const metas = items.map((it) => gridItemMeta(game, p, it));
  let sig = H.activeTab + '|' + H.page + '|' + p.faction
    + (game.placement ? '|pl:' + game.placement.structId : '');
  for (const m of metas) {
    sig += '|' + m.id + ':' + (m.enabled ? 1 : 0) + ':' + m.reason + ':'
      + m.queued + ':' + (m.ready ? 1 : 0) + ':' + m.cost;
  }
  if (sig !== H.gridSig) {
    H.gridSig = sig;
    rebuildTiles(game, metas);
  }
  // cheap per-tick updates: production sweep only
  for (const m of metas) {
    const t = H.tiles[m.id];
    if (!t) continue;
    if (m.progress >= 0) {
      const deg = Math.floor(m.progress * 360);
      t.prog.style.display = 'block';
      t.prog.style.background = 'conic-gradient(rgba(140,210,255,0.30) '
        + deg + 'deg, rgba(0,0,0,0.45) ' + deg + 'deg)';
    } else {
      t.prog.style.display = 'none';
    }
  }
}

function rebuildTiles(game, metas) {
  const H = game.hud;
  hideTooltip(); // v0.3.2: kill any pending tooltip bound to a tile we're about to drop
  H.grid.innerHTML = '';
  H.tiles = {};
  metas.forEach((m, i) => {
    const tile = h('button', 'bb-tile');
    if (i < BUILD_HOTKEYS.length) tile.appendChild(h('span', 'bb-hotkey', BUILD_HOTKEYS[i]));
    const glyph = h('span', 'bb-glyph');
    const shape = m.kind === 'unit' ? shapeForUnit(m.def) : shapeForStructure(m.def);
    glyph.appendChild(h('span', 'bb-shape shape-' + shape));
    const label = m.kind === 'unit'
      ? unitHud(m.id, m.def.name) : structureHud(m.id, m.def.name);
    glyph.appendChild(h('span', 'bb-initials', initialsFor(label)));
    tile.appendChild(glyph);
    tile.appendChild(h('span', 'bb-cost', m.ready ? 'PLACE' : String(m.cost)));
    const badge = h('span', 'bb-badge', '×' + m.queued);
    badge.style.display = m.queued ? 'block' : 'none';
    tile.appendChild(badge);
    const prog = h('div', 'bb-prog');
    prog.style.display = 'none';
    tile.appendChild(prog);
    if (m.ready) tile.classList.add('ready');
    else if (m.queued) tile.classList.add('queued');
    else if (!m.enabled) tile.classList.add('disabled');
    if (game.placement && game.placement.structId === m.id) tile.classList.add('placing');
    tile.addEventListener('click', () => activateItem(game, m));
    tile.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      cancelItem(game, m);
    });
    attachTooltip(game, tile, () => {
      const pp = game.state.players[game.playerSlot];
      const lines = tooltipLines(game.state, pp, m.kind, m.id);
      const r = reasonText(gridItemMeta(game, pp, m));
      if (r) lines.push(r);
      return lines;
    });
    H.grid.appendChild(tile);
    H.tiles[m.id] = { el: tile, prog, badge };
  });
}

function activateItem(game, m) {
  if (m.kind === 'struct') {
    if (m.ready) {
      game.placement = { structId: m.id };
      game.targeting = null;
      game.attackMoveArmed = false;
    } else if (!m.queued && m.enabled) {
      hudPushCmd(game, { type: 'buildStructure', structId: m.id });
    }
  } else if (m.enabled) {
    hudPushCmd(game, { type: 'trainUnit', unitId: m.id });
  }
}

// right-click a tile: cancel the newest queued entry (full refund, sim-side)
function cancelItem(game, m) {
  const st = game.state;
  const p = st.players[game.playerSlot];
  if (m.kind === 'struct') {
    if (m.queued) {
      hudPushCmd(game, { type: 'cancelProduction', kind: 'struct', structId: m.id });
    }
    return;
  }
  const tab = TABS.find((t) => t.id === game.hud.activeTab);
  let best = null, bestI = -1;
  for (const id in st.structures) {
    const s = st.structures[id];
    if (s.owner !== p.slot || !tab || s.defId !== tab.prod) continue;
    const i = s.queue.map((q) => q.unitId).lastIndexOf(m.id);
    if (i > bestI) { bestI = i; best = s; }
  }
  if (best) {
    hudPushCmd(game, { type: 'cancelProduction', kind: 'unit', producerId: best.id, unitId: m.id });
  }
}

function hudKeyPress(game, key) {
  const st = game.state;
  if (!st || !game.hud) return false;
  const p = st.players[game.playerSlot];
  const all = buildGridItems(st, p, game.hud.activeTab);
  const items = all.slice(game.hud.page * BUILD_HOTKEYS.length,
    (game.hud.page + 1) * BUILD_HOTKEYS.length);
  const id = hotkeyMapFor(items)[key];
  if (!id) return false;
  const it = items.find((x) => x.id === id);
  activateItem(game, gridItemMeta(game, p, it));
  return true;
}

// ---- tooltip ------------------------------------------------------------------

function attachTooltip(game, el, linesFn) {
  let timer = null;
  el.addEventListener('mouseenter', () => {
    if (typeof setTimeout !== 'function') { return; }
    timer = setTimeout(() => showTooltip(game, linesFn(), el), 200);
  });
  el.addEventListener('mouseleave', () => {
    if (timer !== null && typeof clearTimeout === 'function') clearTimeout(timer);
    timer = null;
    hideTooltip();
  });
}

function showTooltip(game, lines, anchor) {
  const el = document.getElementById('tooltip');
  if (!el) return;
  el.innerHTML = '';
  lines.forEach((ln, i) => el.appendChild(h('div', i === 0 ? 'tt-name' : 'tt-line', ln)));
  const r = anchor.getBoundingClientRect();
  // canvas.height is in device px (scaled by dpr); CSS layout uses CSS px
  const dpr = (game && game.dpr) || 1;
  const vh = game.canvas ? game.canvas.height / dpr : 800;
  el.style.left = Math.max(4, r.left) + 'px';
  el.style.bottom = (vh - r.top + 8) + 'px';
  el.style.display = 'block';
}

function hideTooltip() {
  const el = document.getElementById('tooltip');
  if (el) el.style.display = 'none';
}

// ---- hint banners + cursor flash ----------------------------------------------

function showHint(game, text) {
  const root = game.hint || document.getElementById('hint');
  if (!root) return;
  const b = h('div', 'hint-banner', text);
  root.appendChild(b);
  if (typeof setTimeout === 'function') {
    setTimeout(() => { b.classList.add('fade'); }, 3600);
    setTimeout(() => { root.removeChild(b); }, 4400);
  }
}

// red reason label flashing at the cursor (failed placement)
function flashAtCursor(game, text) {
  const el = document.getElementById('cursor-label');
  if (!el) return;
  el.textContent = text;
  el.style.left = (game.mouse.sx + 14) + 'px';
  el.style.top = (game.mouse.sy - 12) + 'px';
  el.classList.remove('flash');
  void el.offsetWidth; // restart the CSS animation
  el.classList.add('flash');
}

// ---- actions (deploy / ability / superweapon) -----------------------------------

function updateActions(game, p) {
  const st = game.state;
  const H = game.hud;
  const mcvSel = game.selection.map((id) => st.units[id])
    .find((u) => u && u.owner === p.slot && u.defId === 'MCV');
  const ability = st.data.factions[p.faction].ability;
  const showAb = ability && !PASSIVE_ABILITIES.includes(ability);
  const abCd = showAb ? Math.ceil(Math.max(0, p.abilityCdUntil - st.tick) / 10) : -1;
  // gate actives on their Unique/SW structure (mirrors validateCommand), so the

  const abGateId = showAb ? ABILITY_STRUCT[ability] : null;
