<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mca-repro</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0c10;
    font:13px/1.45 system-ui, sans-serif; color:#dfe6f2; }
  #game { position:fixed; inset:0; display:block; cursor:crosshair; }
  #menu, #banner { position:fixed; inset:0; background:rgba(8,10,13,0.97);
    z-index:10; overflow-y:auto; padding:40px; }
  #menu.hidden, #banner.hidden { display:none; }
  .menu-box { max-width:780px; margin:0 auto; background:rgba(12,14,18,0.6);
    border:1px solid #444; border-radius:8px; padding:24px 28px; }
  .menu-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .menu-btn { background:#14171d; border:1px solid #2a2f3a; color:#cfd6e2;
    padding:8px 16px; cursor:pointer; font-size:12px; border-radius:5px; }
  #report { position:fixed; top:0; left:0; z-index:99; background:#000;
    color:#0f0; padding:8px; white-space:pre; font:12px monospace; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="topbar"></div>
<div id="buildbar"></div>
<div id="sel-panel"></div>
<div id="minimap"></div>
<div id="hint"></div>
<div id="cursor-label"></div>
<div id="tooltip"></div>
<div id="menu"></div>
<div id="banner" class="hidden"></div>
<div id="report"></div>
<script type="module">
globalThis.__MCA_NO_AUTOBOOT = true;
const report = [];
const say = (s) => { report.push(s); document.getElementById('report').textContent = report.join('\n'); };
window.onerror = (m, s, l, c) => say('ONERROR: ' + m + ' @' + (s || '').split('/').pop() + ':' + l + ':' + c);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const q = new URLSearchParams(location.search);
const scenario = q.get('scenario') || 'restart';

function findBtn(rootId, text) {
  let found = null;
  (function walk(el) {
    if (!found && el.tagName === 'BUTTON' && el.textContent === text) found = el;
    for (const c of el.children || []) walk(c);
  })(document.getElementById(rootId));
  return found;
}

// canvas pixel stats: count black / dim(non-black dark) / lit pixels
function canvasStats(g) {
  const c = g.canvas, ctx = c.getContext('2d');
  const img = ctx.getImageData(0, 0, c.width, c.height).data;
  let black = 0, dim = 0, lit = 0;
  for (let i = 0; i < img.length; i += 16) { // sample every 4th pixel
    const v = img[i] + img[i + 1] + img[i + 2];
    if (v < 12) black++;
    else if (v < 120) dim++;
    else lit++;
  }
  return { black, dim, lit };
}

const M = await import('./src/main.js');
const Cam = await import('./src/game/camera.js');
await M.boot();
const g = M.getGame();
say('booted scenario=' + scenario);

if (scenario === 'restart' || scenario === 'abandon') {
  M.startMatch({ map: 'duel', faction: 'Egypt', seed: 1234,
    opponents: [{ faction: 'Algeria', personality: 'Front', difficulty: 'recruit' }],
    ally: null });
  await sleep(500);
  // explore: deploy MCV (structure sight) + move a wide trail with the MCV first
  const st0 = g.state;
  const mcv = Object.values(st0.units).find((u) => u.owner === 0 && u.defId === 'MCV');
  g.pendingCmds.push({ player: 0, type: 'move', unitIds: [mcv.id],
    x: st0.map.w * 32, y: st0.map.h * 32 });
  await sleep(4000); // MCV roams, leaving a seen trail; AI base gets going
  const before = canvasStats(g);
  say('before: ' + JSON.stringify(before) + ' tick=' + g.state.tick);

  if (scenario === 'restart') {
    g.openMenu();
    await sleep(100);
    const rb = findBtn('menu', 'Restart');
    say('restart btn: ' + !!rb);
    if (rb) rb.click();
  } else {
    g.openMenu();
    await sleep(100);
    const ab = findBtn('menu', 'Abandon match');
    if (ab) { ab.click(); }
    await sleep(100);
    const ab2 = findBtn('menu', 'Really abandon?');
    say('abandon btns: ' + !!ab + '/' + !!ab2);
    if (ab2) ab2.click();
    await sleep(200);
    const sk = findBtn('menu', 'Skirmish');
    if (sk) sk.click();
    await sleep(100);
    let tig = null;
    (function walk(el) {
      if (!tig && el.tagName === 'BUTTON' && el.textContent.indexOf('Tigris Crossing') === 0) tig = el;
      for (const c of el.children || []) walk(c);
    })(document.getElementById('menu'));
    if (tig) tig.click();
    const sb = findBtn('menu', 'Start match');
    say('setup btns: sk=' + !!sk + ' tig=' + !!tig + ' start=' + !!sb);
    if (sb) sb.click();
  }
  await sleep(1500);
  const after = canvasStats(g);
  say('after: ' + JSON.stringify(after)
    + ' tick=' + (g.state && g.state.tick)
    + ' map=' + (g.state && g.state.map.name)
    + ' cam=' + (g.camera && Math.round(g.camera.x) + ',' + Math.round(g.camera.y)));
  say('renderFog=' + (g.render && g.render.fog.width + 'x' + g.render.fog.height)
    + ' fogTick=' + (g.render && g.render.fogTick));
  // spawn-0 screen position should be lit (visible area)
  say('DONE');
}

if (scenario === 'zoom') {
  M.startMatch({ map: 'duel', faction: 'Egypt', seed: 1234,
    opponents: [{ faction: 'Algeria', personality: 'Front', difficulty: 'recruit' }],
    ally: null });
  await sleep(1000);
  let worst = 0, frames = 0, err = '';
  const t0 = performance.now();
  const tick0 = g.state.tick;
  await new Promise((done) => {
    function step() {
      frames++;
      try {
        // hammer zoom extremes + pan past map edges every frame
        const z = frames % 2 ? 0.35 : 2.5;
        g.camera.zoom = z;
        Cam.zoomCameraAt(g.camera, frames % 2 ? 0.8 : 1.2, 640, 400);
        g.camera.x = -500 + frames * 30; // deliberately out of bounds
        g.camera.y = 4000 - frames * 25;
        const s = performance.now();
        // renderFrame is called by the game loop; here we just wait a frame
        requestAnimationFrame(step);
        const ms = performance.now() - s;
        if (ms > worst) worst = ms;
      } catch (e) { err = String(e); done(); return; }
      if (performance.now() - t0 > 6000) done();
    }
    requestAnimationFrame(step);
  });
  say('zoom frames=' + frames + ' err=' + err
    + ' ticks=' + (g.state.tick - tick0) + ' over 6s (expect ~60)');
  say('DONE');
}

if (scenario === 'twodepot') {
  M.startMatch({ map: 'duel', faction: 'Egypt', seed: 99,
    opponents: [{ faction: 'Algeria', personality: 'Front', difficulty: 'recruit' }],
    ally: null });
  await sleep(300);
  const Sim = await import('./src/sim/index.js');
  const st = g.state;
  say('Sim keys: ' + Object.keys(Sim).length
    + ' cellOf=' + typeof Sim.cellOf + ' findSpawnCell=' + typeof Sim.findSpawnCell
    + ' structCenter=' + typeof Sim.structCenter + ' findDepotPlacement='
    + typeof Sim.findDepotPlacement + ' addStructure=' + typeof Sim.addStructure
    + ' addUnit=' + typeof Sim.addUnit);
  const CELLW = 64;
  const mcv = Object.values(st.units).find((u) => u.owner === 0 && u.defId === 'MCV');
  g.pendingCmds.push({ player: 0, type: 'deployMCV', unitId: mcv.id });
  await sleep(500);
  st.players[0].credits = 100000;
  // direct setup (legal depot spots far from base need a temp ConYard nearby):
  // two depots on distinct oil fields, each with its bound harvester
  const fields = Object.values(st.oilFields);
  for (let d = 0; d < 2 && d < fields.length; d++) {
    const o = fields[d];
    const cx = Math.max(0, Math.min(st.map.w - 3, Math.floor(o.x / CELLW) - 3));
    const cy = Math.max(0, Math.min(st.map.h - 3, Math.floor(o.y / CELLW) - 3));
    const cyT = Sim.addStructure(st, 'SH-01', 0, cx, cy);
    const spot = Sim.findDepotPlacement(st, 0, st.structDefs['SH-03']);
    delete st.structures[cyT.id];
    if (!spot) { say('depot spot ' + d + ' NOT FOUND'); continue; }
    const dep = Sim.addStructure(st, 'SH-03', 0, spot.x, spot.y);
    const dc = Sim.structCenter(dep);
    const cell = Sim.findSpawnCell(st, 0, st.unitDefs.HARV, dc);
    const hv = Sim.addUnit(st, 'HARV', 0, cell.x, cell.y);
    dep.harvesterId = hv.id;
  }
  // measure 10s of real time: frame dts + sim tick progress
  let frames = 0, over50 = 0, worst = 0, last = performance.now();
  const tick0 = g.state.tick, t0 = performance.now(), cr0 = g.state.players[0].credits;
  await new Promise((done) => {
    function step() {
      const now = performance.now();
      const dt = now - last; last = now;
      frames++;
      if (dt > 50) over50++;
      if (dt > worst) worst = dt;
      if (now - t0 > 10000) done(); else requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  say('10s: frames=' + frames + ' over50ms=' + over50 + ' worstDt=' + worst.toFixed(0)
    + ' ticks=' + (g.state.tick - tick0) + ' (expect ~100)'
    + ' income=' + (g.state.players[0].credits - cr0));
  say('DONE');
}
</script>
</body>
</html>
