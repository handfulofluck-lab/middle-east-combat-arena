<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MCA M2 — sim tests</title>
<style>
  body { background:#111; color:#ddd; font:14px/1.5 monospace; padding:16px; }
  .pass { color:#7c7; } .fail { color:#e66; } #sum { margin-top:8px; font-weight:bold; }
</style>
</head>
<body>
<h1>MCA M2 — deterministic sim tests</h1>
<pre id="out">running…</pre>
<pre id="sum"></pre>
<script type="module">
  import { runTests } from './test/sim.test.js';
  const out = document.getElementById('out');
  const sum = document.getElementById('sum');
  runTests().then((rs) => {
    out.textContent = '';
    let pass = 0;
    for (const r of rs) {
      const line = `${r.pass ? 'PASS' : 'FAIL'}  ${r.name}${r.detail ? '  —  ' + r.detail : ''}`;
      console.log(line);
      const div = document.createElement('div');
      div.className = r.pass ? 'pass' : 'fail';
      div.textContent = line;
      out.appendChild(div);
      if (r.pass) pass++;
    }
    sum.textContent = `${pass}/${rs.length} passed`;
    console.log(sum.textContent);
  }).catch((e) => {
    out.textContent = 'RUNNER ERROR\n' + (e && e.stack || e);
    console.error(e);
  });
</script>
</body>
</html>
