<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>MCA — Audio Lab</title>
<style>
  :root { --gold:#c8a23a; --ink:#0c0e11; --panel:#151920; --text:#dfe6f2; --dim:#8a94a6; }
  * { box-sizing:border-box; }
  body { margin:0; padding:18px 22px 60px; background:var(--ink); color:var(--text);
    font:13px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { font-size:17px; letter-spacing:0.22em; text-transform:uppercase; color:#f5e7bf; margin:0 0 2px; }
  p.sub { margin:0 0 14px; color:var(--dim); font-size:12px; }
  section { background:var(--panel); border:1px solid rgba(200,162,58,0.25); border-radius:5px;
    padding:10px 14px 14px; margin:0 0 14px; }
  h2 { font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--gold); margin:2px 0 10px; }
  h3 { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); margin:12px 0 6px; }
  button { background:#1f2530; color:var(--text); border:1px solid #333c4b; border-radius:3px;
    padding:5px 10px; margin:0 5px 5px 0; font:12px/1.2 ui-monospace, Consolas, monospace; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  button:active { background:#2a3140; }
  button.warn { border-color:rgba(200,162,58,0.6); color:#f0dda8; }
  button.on { background:#3b3320; border-color:var(--gold); }
  label.slider { display:inline-flex; flex-direction:column; width:150px; margin:0 14px 6px 0;
    font:11px ui-monospace, Consolas, monospace; color:var(--dim); vertical-align:top; }
  label.slider input { width:100%; accent-color:var(--gold); }
  canvas { display:block; border-radius:3px; margin-bottom:8px; }
  pre.info { margin:0 0 10px; font:11px/1.5 ui-monospace, Consolas, monospace; color:#cfd6e2; white-space:pre-wrap; }
  .status { color:var(--dim); font-size:12px; }
  .out { overflow-x:auto; }
  table { border-collapse:collapse; font:11px ui-monospace, Consolas, monospace; margin:4px 0 10px; }
  th, td { border:1px solid #2a303a; padding:2px 6px; text-align:right; white-space:nowrap; }
  th { color:var(--gold); font-weight:600; }
  td:first-child, th:first-child { text-align:left; }
</style>
</head>
<body>
<h1>MCA — Audio Lab</h1>
<p class="sub">Every sound is synthesised at runtime with the Web Audio API. Real-time controls use the
game's audio facade; the verification section renders the same engine offline and measures it.
Harness entry point: <code>window.__audioLab</code>.</p>
<div id="lab"></div>
<script type="module" src="./src/audio/audio_lab.js"></script>
</body>
</html>
