<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MCA — Middle East Combat Arena</title>
<style>
  :root { --accent:#c8a23a; --accent-dim:rgba(200,162,58,0.35); }
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0c10;
    font:13px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif; color:#dfe6f2; }
  #game { position:fixed; inset:0; width:100vw; height:100vh; display:block;
    cursor:crosshair; z-index:0; }
  /* v0.11.0: 3D layers. #gl-canvas is created by gl.js (z 2);
     #ui-overlay carries 2D selection boxes / drag lines above it. */
  #ui-overlay { position:fixed; inset:0; width:100vw; height:100vh;
    display:none; pointer-events:none; z-index:3; }
  #menu-3d { position:fixed; inset:0; width:100vw; height:100vh;
    display:none; pointer-events:none; z-index:1; background:#0b0d10; }
  /* 3D menu flyby: the menu plate becomes a translucent scrim so the
     cinematic reads behind it (the rule needs !important because menu.js
     also sets an inline keyart background). */
  body.menu-3d #menu { background:linear-gradient(180deg,
    rgba(10,8,5,0.26), rgba(8,10,13,0.60)) !important; }
  /* full-bleed intro / victory: the HUD would only clutter the sequence */
  body.cinematic #topbar, body.cinematic #buildbar,
  body.cinematic #sel-panel, body.cinematic #army-panel,
  body.cinematic #minimap, body.cinematic #hint,
  body.cinematic #alerts, body.cinematic #cursor-label,
  body.cinematic #tooltip, body.cinematic #spec-badge,
  body.cinematic #pause-banner, body.cinematic #gfx-toggle {
    display:none !important; }
  /* graphics preference chip (main menu / setup only) */
  #gfx-toggle { position:fixed; right:22px; bottom:20px; z-index:12;
    display:none; align-items:center; gap:8px; padding:8px 12px;
    background:rgba(10,12,16,0.9); border:1px solid var(--accent-dim);
    border-radius:4px; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:#cfd6e2; }
  #gfx-toggle label { display:flex; align-items:center; gap:7px; cursor:pointer; }
  #gfx-toggle input { accent-color:var(--accent); }
  #gfx-toggle .note { color:#8a94a6; font-size:9px; letter-spacing:0.06em; }
  /* in-engine cinematics overlay */
  #cinematic { position:fixed; inset:0; z-index:11; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; pointer-events:auto;
    background:radial-gradient(ellipse at 50% 45%, rgba(5,6,8,0.08),
      rgba(5,6,8,0.58)); font-family:"Segoe UI", Roboto, Arial, sans-serif; }
  #cinematic.show { display:flex; }
  #cinematic .cine-kicker { color:#d8cda9; font-size:12px;
    letter-spacing:0.42em; text-transform:uppercase; opacity:0.9; }
  #cinematic .cine-title { color:#f4e4b6; font-size:clamp(40px, 8vw, 92px);
    font-weight:800; letter-spacing:0.10em; text-transform:uppercase;
    text-shadow:0 4px 26px rgba(0,0,0,0.7); }
  #cinematic .cine-sub { color:#e9dfc4; font-size:16px;
    letter-spacing:0.20em; text-transform:uppercase; }
  #cinematic .cine-vs { color:#b9b29b; font-size:12px;
    letter-spacing:0.24em; text-transform:uppercase; margin-top:4px; }
  #cinematic .cine-skip { position:absolute; bottom:8%; color:#9c967f;
    font-size:10px; letter-spacing:0.18em; text-transform:uppercase; }
  #cinematic.victory .cine-title { color:#ffe39a;
    text-shadow:0 0 30px rgba(255,196,80,0.45), 0 4px 26px rgba(0,0,0,0.8); }
  #cinematic.defeat .cine-title { color:#ff9b86;
    text-shadow:0 0 30px rgba(210,50,30,0.35), 0 4px 26px rgba(0,0,0,0.8); }
  #cinematic.intro, #cinematic.victory, #cinematic.defeat {
    background:radial-gradient(ellipse at 50% 45%, rgba(5,6,8,0.34),
      rgba(5,6,8,0.66)); }
  #cinematic .cine-skip.hide { display:none; }

  .panel { background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    border-radius:5px; }
  .micro { font-size:9px; text-transform:uppercase; letter-spacing:0.14em;
    color:#7d8797; }

  /* dim the chrome while placing a structure */
  body.placing #topbar, body.placing #buildbar,
  body.placing #minimap, body.placing #sel-panel {
    opacity:0.35; transition:opacity 0.15s; }
  #topbar, #buildbar, #minimap, #sel-panel { transition:opacity 0.15s; }
  /* crosshair feedback while targeting an ability / attack-move */
  body.targeting #game, body.attackmove #game { cursor:cell; }
  /* capture feedback: engineer hovering a hostile/neutral structure */
  body.capture #game { cursor:copy; }

  /* hide all in-match HUD chrome while a menu overlay owns the screen */
  body.in-menu #topbar, body.in-menu #buildbar, body.in-menu #minimap,
  body.in-menu #sel-panel, body.in-menu #army-panel, body.in-menu #hint,
  body.in-menu #tooltip, body.in-menu #cursor-label { display:none; }

  /* generic hidden helper (v0.10.0: reused by the MP chrome); the specific
     rules above keep their precedence where they already exist */
  .hidden { display:none !important; }

  /* ---- slim top bar ---- */
  #topbar { position:fixed; top:0; left:0; right:0; height:36px; z-index:5;
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background:rgba(12,14,18,0.85); border-bottom:1px solid var(--accent-dim);
    user-select:none; }
  .tb-label { font-size:9px; text-transform:uppercase; letter-spacing:0.14em;
    color:#7d8797; }
  .tb-credits { color:#ffd76a; font-weight:600; font-size:14px; min-width:48px; }
  .tb-val { color:#cfd6e2; font-size:12px; font-variant-numeric:tabular-nums; }
  .tb-power { display:inline-flex; align-items:center; }
  .tb-power-dot { width:8px; height:8px; border-radius:50%; display:inline-block;
    margin-right:5px; }
  .tb-power-dot.ok { background:#4caf50; }
  .tb-power-dot.amber { background:#ffb300; }
  .tb-power-dot.low { background:#e53935; box-shadow:0 0 6px #e53935; }
  .tb-spacer { flex:1; }
  .tb-btn { background:transparent; border:1px solid #2a2f3a; color:#aab4c4;
    padding:3px 10px; border-radius:4px; cursor:pointer; font-size:10px;
    text-transform:uppercase; letter-spacing:0.08em; font-family:inherit; }
  .tb-btn:hover { border-color:var(--accent); color:#fff; }
  .tb-btn.active { background:var(--accent-dim); color:#fff;
    border-color:var(--accent); }
  /* ---- top-bar zoom control (v0.6.0): the wheel now pans; [-] slider [+] ---- */
  .tb-zoom { display:inline-flex; align-items:center; gap:4px; }
  .tb-zoom-slider { width:90px; accent-color:var(--accent); }
  .tb-zoom-slider:disabled { opacity:0.35; }
  .tb-zoom-btn { padding:3px 7px; }

  /* ---- bottom-center build bar ---- */
  #buildbar { position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:5; background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    border-radius:6px; padding:6px 8px 8px; user-select:none; max-width:72vw; }
  .bb-tabs { display:flex; gap:3px; margin-bottom:6px; }
  .bb-tab { padding:4px 12px; font-size:10px; text-transform:uppercase;
    letter-spacing:0.12em; color:#8a94a6; background:transparent;
    border:1px solid #232833; border-radius:4px; cursor:pointer;
    font-family:inherit; }
  .bb-tab:hover { color:#dfe6f2; }
  .bb-tab.active { color:#fff; border-color:var(--accent);
    background:rgba(255,255,255,0.06); }
  .bb-page { align-self:center; margin-left:auto; font-size:10px; color:#8a94a6;
    text-transform:uppercase; letter-spacing:0.1em; }
  .bb-row { display:flex; gap:8px; align-items:stretch; }
  /* v0.9.0: ONE row of up to 6 tiles (QWERTF) — never wraps; tabs with more
     items page via Tab or the flanking ‹ › arrows (see .bb-arrow) */
  .bb-grid { display:flex; flex-wrap:nowrap; gap:5px; align-items:center; }
  .bb-arrow { background:#14171d; border:1px solid #2a2f3a; color:#aab4c4;
    border-radius:4px; padding:6px 9px; cursor:pointer; font-size:13px;
    font-family:inherit; flex:none; align-self:center; }
  .bb-arrow:hover { border-color:var(--accent); color:#fff; }
  .bb-arrow:disabled { opacity:0.3; cursor:default; }
  .bb-tile { position:relative; width:60px; height:64px; background:#14171d;
    border:1px solid #262c38; border-radius:5px; cursor:pointer; color:#dfe6f2;
    display:flex; align-items:center; justify-content:center; padding:0;
    overflow:hidden; font-family:inherit; }
  .bb-tile:hover { border-color:var(--accent); }
  .bb-tile.disabled { opacity:0.38; cursor:not-allowed; }
  .bb-tile.ready { border-color:#4caf50; box-shadow:0 0 6px rgba(76,175,80,0.35); }
  .bb-tile.queued { border-color:#ffb300; }
  .bb-tile.placing { border-color:#4caf50; background:rgba(76,175,80,0.12); }
  .bb-hotkey { position:absolute; top:2px; left:4px; font-size:9px;
    color:#8a94a6; z-index:2; }
  .bb-glyph { position:relative; width:26px; height:26px; display:flex;
    align-items:center; justify-content:center; }
  .bb-shape { position:absolute; inset:0; background:var(--accent);
    border-radius:3px; }
  .bb-shape.shape-circle { border-radius:50%; }
  .bb-shape.shape-triangle { clip-path:polygon(50% 0, 100% 100%, 0 100%);
    border-radius:0; }
  .bb-shape.shape-diamond { transform:rotate(45deg) scale(0.8); }
  /* structure silhouettes (shared by build tiles + selection glyphs) */
  .shape-octagon { clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,
    30% 100%,0 70%,0 30%); border-radius:0; }
  .shape-hexagon { clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,
    0 50%); border-radius:0; }
  .shape-barrel { border-radius:35%; }
  .shape-chevron { clip-path:polygon(50% 0,100% 50%,80% 100%,20% 100%,0 50%);
    border-radius:0; }
  .shape-runway { clip-path:polygon(20% 0,80% 0,65% 100%,35% 100%);
    border-radius:0; }
  .shape-dock { clip-path:polygon(0 0,100% 0,100% 60%,70% 100%,30% 100%,0 60%);
    border-radius:0; }
  .shape-bunker { clip-path:polygon(0 35%,50% 0,100% 35%,100% 100%,0 100%);
    border-radius:0; }
  .shape-spike { clip-path:polygon(50% 0,70% 60%,100% 100%,0 100%,30% 60%);
    border-radius:0; }
  .shape-radar { clip-path:polygon(50% 0,93% 25%,100% 60%,70% 60%,70% 100%,
    30% 100%,30% 60%,0 60%,7% 25%); border-radius:0; }
  .shape-star, .shape-star-sw { clip-path:polygon(50% 0,61% 35%,98% 35%,
    68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); border-radius:0; }
  .bb-initials { position:relative; font-size:10px; font-weight:700;
    color:#0c0e12; }
  .bb-cost { position:absolute; bottom:2px; right:4px; font-size:9px;
    color:#ffd76a; z-index:2; }
  .bb-tile.ready .bb-cost { color:#9f9; }
  .bb-badge { position:absolute; top:2px; right:4px; font-size:9px;
    background:#ffb300; color:#111; border-radius:6px; padding:0 4px; z-index:2; }
  .bb-prog { position:absolute; inset:0; pointer-events:none; z-index:1; }
  /* painted cameo plates (pass-3 iconArt): cover the tile's icon area; the
     CSS glyph stays underneath as the decode-failure fallback; dim states
     (disabled/placing) dim the img too via the tile's own opacity */
  .bb-cameo { position:absolute; top:1px; left:50%; width:46px; height:46px;
    margin-left:-23px; object-fit:cover; border-radius:3px;
    border:1px solid var(--accent-dim); z-index:0; pointer-events:none; }
  .bb-tile.has-cameo .bb-hotkey { background:rgba(6,8,10,0.72); color:#dfe6f2;
    border-radius:3px; padding:0 3px; }
  .bb-tile.has-cameo .bb-cost { background:rgba(6,8,10,0.72);
    border-radius:3px; padding:0 3px; }
  /* ---- build queue strip (v0.4.3): focused producer's queue, oldest first ---- */
  .bb-queue { display:flex; gap:4px; margin-top:5px; justify-content:center; }
  .bb-queue-label { align-self:center; font-size:9px; text-transform:uppercase;
    letter-spacing:0.1em; color:#8a94a6; margin-right:2px; white-space:nowrap; }
  .bb-queue-label.dim { opacity:0.45; }
  .bb-chip { position:relative; width:46px; height:24px; background:#14171d;
    border:1px solid #262c38; border-radius:4px; cursor:pointer; color:#dfe6f2;
    font-family:inherit; padding:0; overflow:hidden; }
  .bb-chip:hover { border-color:var(--accent); }
  .bb-chip-code { font-size:9px; font-weight:700; color:#cfd6e2;
    letter-spacing:0.04em; }
  .bb-chip-bar { position:absolute; left:0; bottom:0; height:3px; width:0;
    background:#4da3ff; }
  .bb-actions { display:flex; flex-direction:column; gap:5px;
    justify-content:center; min-width:132px; border-left:1px solid #232833;
    padding-left:8px; }
  .bb-action { background:#14171d; border:1px solid #2a2f3a; color:#cfd6e2;
    border-radius:5px; padding:8px 10px; cursor:pointer; font-size:11px;
    text-transform:uppercase; letter-spacing:0.08em; font-family:inherit; }
  .bb-action:hover { border-color:var(--accent); color:#fff; }
  .bb-action.disabled { opacity:0.45; cursor:not-allowed; }
  .bb-action.ready { border-color:#4caf50; color:#9f9; }
  .bb-action.placing { border-color:var(--accent); background:rgba(255,255,255,0.06); }
  .bb-stance-row { display:flex; gap:4px; }
  .bb-action.bb-stance { flex:1; padding:4px 2px; font-size:10px; text-align:center; }
  .bb-action.bb-stance.on { border-color:var(--accent); color:#fff;
    background:rgba(255,255,255,0.08); }
  .bb-action.bb-kit { text-transform:none; letter-spacing:0.02em; text-align:left; }
  .bb-deploy { font-size:14px; font-weight:700; padding:14px 10px;
    border-color:#4caf50; color:#9f9; animation:bb-pulse 1.2s infinite; }
  @keyframes bb-pulse {
    0%,100% { box-shadow:0 0 4px rgba(76,175,80,0.4); }
    50% { box-shadow:0 0 16px rgba(76,175,80,0.9); }
  }

  /* ---- selection panel (bottom-left, above the army panel) ---- */
  #sel-panel { position:fixed; left:10px; bottom:316px; min-width:220px;
    max-width:300px; max-height:170px; overflow-y:auto; z-index:5;
    background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    border-radius:5px; padding:6px 8px; font-size:12px; user-select:none; }
  #sel-panel:empty { display:none; }
  .sel-row { display:flex; align-items:center; gap:6px; padding:2px 0;
    white-space:nowrap; }
  .sel-glyph { width:18px; height:18px; border-radius:3px; flex:none;
    background:var(--accent); color:#0c0e12; font-size:8px; font-weight:700;
    display:flex; align-items:center; justify-content:center; }
  /* 48px cameo plate next to the name for a single selection (pass-3 iconArt) */
  .sel-cameo { position:static; width:48px; height:48px; margin-left:0;
    flex:none; }
  .sel-name { color:#dfe6f2; }
  .sel-hp { color:#8f8; font-size:10px; font-variant-numeric:tabular-nums; }
  .sel-hpbar { width:56px; height:4px; background:#222; border-radius:2px;
    overflow:hidden; display:inline-block; }
  .sel-hpbar > span { display:block; height:100%; background:#4caf50; }
  .sel-tip { color:#7d8797; font-size:10px; text-transform:uppercase;
    letter-spacing:0.1em; padding-top:4px; }

  /* ---- army control panel (v0.5.1): docked above the minimap ---- */
  #army-panel { position:fixed; left:10px; bottom:198px; width:220px;
    z-index:5; background:rgba(12,14,18,0.85);
    border:1px solid var(--accent-dim); border-radius:5px; user-select:none; }
  .ap-head { font-size:9px; text-transform:uppercase; letter-spacing:0.14em;
    color:#7d8797; padding:4px 8px; cursor:pointer; }
  .ap-head:hover { color:#dfe6f2; }
  .ap-head::after { content:'▾'; float:right; }
  #army-panel.closed .ap-head::after { content:'▸'; }
  #army-panel.closed .ap-body { display:none; }
  .ap-body { display:flex; flex-direction:column; gap:3px;
    padding:0 6px 6px; }
  .ap-row { display:flex; align-items:center; gap:4px; }
  .ap-name { flex:1; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:#aab4c4; }
  .ap-count { color:#ffd76a; font-size:10px; margin-right:2px;
    font-variant-numeric:tabular-nums; }
  .ap-btn { background:#14171d; border:1px solid #2a2f3a; color:#cfd6e2;
    border-radius:4px; padding:2px 6px; cursor:pointer; font-size:9px;
    font-family:inherit; }
  .ap-btn:hover { border-color:var(--accent); color:#fff; }
  .ap-btn.disabled, .ap-btn:disabled { opacity:0.38; cursor:not-allowed; }

  /* ---- minimap bottom-left ---- */
  #minimap { position:fixed; left:10px; bottom:10px; width:220px; height:180px;
    background:#000; border:1px solid var(--accent-dim); border-radius:5px;
    overflow:hidden; z-index:5; }
  #minimap canvas { width:100%; height:100%; display:block; cursor:pointer; }

  /* ---- hint banners top-center ---- */
  #hint { position:fixed; top:46px; left:50%; transform:translateX(-50%);
    z-index:6; display:flex; flex-direction:column; gap:6px; align-items:center;
    pointer-events:none; }
  .hint-banner { background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    color:#dfe6f2; padding:6px 14px; border-radius:5px; font-size:12px;
    letter-spacing:0.04em; animation:hb-in 0.25s ease-out;
    transition:opacity 0.6s; }
  .hint-banner.mcv { border-color:var(--accent); color:#ffd76a; }
  .hint-banner.fade { opacity:0; }
  @keyframes hb-in { from { opacity:0; transform:translateY(-6px); }
    to { opacity:1; transform:none; } }

  /* ---- under-attack alerts (top-right stack, clickable) ---- */
  #alerts { position:fixed; top:46px; right:10px; z-index:7; display:flex;
    flex-direction:column; gap:6px; align-items:flex-end; }
  .alert-banner { background:rgba(30,10,10,0.9); border:1px solid #e53935;
    color:#ff8a80; padding:6px 12px; border-radius:5px; font-size:12px;
    letter-spacing:0.04em; cursor:pointer; animation:hb-in 0.25s ease-out;
    transition:opacity 0.6s; }
  .alert-banner:hover { border-color:#ff8a80; color:#fff; }
  .alert-banner.fade { opacity:0; }

  /* ---- red reason label at cursor ---- */
  #cursor-label { position:fixed; pointer-events:none; z-index:8;
    background:rgba(30,10,10,0.9); border:1px solid #e53935; color:#ff8a80;
    padding:3px 8px; font-size:10px; border-radius:4px; opacity:0;
    text-transform:uppercase; letter-spacing:0.08em; }
  #cursor-label.flash { animation:cl-flash 1.4s ease-out forwards; }
  @keyframes cl-flash { 0% { opacity:1; } 70% { opacity:1; } 100% { opacity:0; } }

  /* ---- tooltip ---- */
  #tooltip { position:fixed; z-index:9; background:rgba(12,14,18,0.95);
    border:1px solid var(--accent-dim); border-radius:5px; padding:8px 10px;
    font-size:11px; pointer-events:none; display:none; max-width:250px; }
  #tooltip .tt-name { color:#fff; font-weight:600; margin-bottom:2px; }
  #tooltip .tt-line { color:#9aa5b5; }
  #tooltip .tt-line:last-child { color:#ffb300; }

  /* ---- tutorial overlay (v0.6.0): compact EVA strip under the top bar ----
     the battlefield center stays clear; only Skip/Begin take pointer events */
  #tutor { position:fixed; top:44px; left:50%; transform:translateX(-50%);
    z-index:8; pointer-events:none; }
  #tutor.hidden { display:none; }
  body.in-menu #tutor { display:none; }
  .tutor-box { max-width:560px; background:rgba(8,12,16,0.75);
    backdrop-filter:blur(4px); border:1px solid var(--accent-dim);
    border-radius:6px; padding:8px 14px; box-shadow:0 0 12px rgba(0,0,0,0.4);
    animation:hb-in 0.25s ease-out; }
  .tutor-eva { font-size:9px; letter-spacing:0.2em; color:var(--accent);
    text-transform:uppercase; margin-bottom:4px; }
  .tutor-text { font-size:13px; color:#e8eef8; line-height:1.4; }
  .tutor-row { display:flex; justify-content:flex-end; align-items:center;
    gap:14px; margin-top:6px; }
  .tutor-done { pointer-events:auto; background:rgba(76,175,80,0.15);
    border:1px solid #4caf50; color:#9f9; padding:6px 18px; border-radius:5px;
    cursor:pointer; font-size:12px; text-transform:uppercase;
    letter-spacing:0.1em; font-family:inherit; }
  .tutor-done:hover { background:rgba(76,175,80,0.28); }
  .tutor-skip { pointer-events:auto; cursor:pointer; font-size:10px;
    text-transform:uppercase; letter-spacing:0.12em; color:#7d8797;
    text-decoration:underline; }
  .tutor-skip:hover { color:#fff; }
  .tutor-pulse { animation:tutor-pulse 1.1s infinite; }
  @keyframes tutor-pulse {
    0%,100% { box-shadow:0 0 4px var(--accent-dim); border-color:var(--accent); }
    50% { box-shadow:0 0 18px var(--accent); border-color:#fff; }
  }

  /* ---- v0.7.1 match briefing: full-screen faction plate over a dimmed
     backdrop; z 7 keeps the #alerts stack (same z, later in the DOM) and the
     floating tooltip/cursor labels above it ---- */
  #briefing { position:fixed; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center;
    background:rgba(5,7,10,0.78); }
  #briefing.hidden { display:none; }
  .brief-box { display:flex; flex-direction:column; align-items:center;
    gap:14px; }
  .brief-poster { width:min(720px, 92vw); display:block; border-radius:8px;
    border:2px solid var(--accent);
    box-shadow:0 0 32px rgba(0,0,0,0.7), 0 0 0 1px var(--accent-dim); }
  .brief-deploy { font-size:16px; padding:12px 40px; letter-spacing:0.16em; }
  .brief-hint { font-size:10px; text-transform:uppercase; letter-spacing:0.14em;
    color:#7d8797; }

  /* ---- menu + banner overlays ---- */
  #menu, #banner { position:fixed; inset:0; background:rgba(8,10,13,0.97);
    z-index:10; overflow-y:auto; padding:40px; }
  #menu.hidden, #banner.hidden { display:none; }
  .menu-box { max-width:780px; margin:0 auto; background:rgba(12,14,18,0.6);
    border:1px solid var(--accent-dim); border-radius:8px; padding:24px 28px; }
  .menu-box h1 { color:#fff; margin:0 0 4px; letter-spacing:0.04em;
    font-size:26px; }
  .menu-box h1 .acc { color:var(--accent); }
  .menu-box p { color:#8a94a6; margin:0 0 10px; font-size:12px;
    text-transform:uppercase; letter-spacing:0.12em; }
  .menu-box h2 { color:#8a94a6; margin:18px 0 6px; font-size:11px;
    text-transform:uppercase; letter-spacing:0.14em; font-weight:600; }
  .menu-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;
    align-items:center; }
  .menu-btn { background:#14171d; border:1px solid #2a2f3a; color:#cfd6e2;
    padding:8px 16px; cursor:pointer; font-size:12px; border-radius:5px;
    text-transform:uppercase; letter-spacing:0.1em; font-family:inherit; }
  .menu-btn:hover { border-color:var(--accent); color:#fff; }
  .menu-btn.sel { border-color:var(--accent); color:#fff;
    background:var(--accent-dim); }
  .fac-btn { width:230px; text-align:left; padding:8px 10px;
    text-transform:none; letter-spacing:0.02em; }
  .fac-btn:has(.fac-poster) { display:flex; flex-direction:column; gap:5px; }
  .fac-poster { width:100%; border-radius:4px; display:block;
    border:1px solid var(--accent-dim); }
  /* v0.9.0 faction strip: smooth-scrolling portrait cards — 170px cards with
     24px gaps so the neighbors peek in; snap is mandatory at rest and
     disabled while a pointer drag (or its momentum glide) owns the strip */
  .fac-strip-wrap { display:flex; align-items:center; gap:4px;
    margin-bottom:6px; }
  .fac-strip { display:flex; gap:24px; overflow-x:auto; width:490px;
    max-width:72vw; scroll-snap-type:x mandatory; scroll-behavior:smooth;
    padding:2px; scrollbar-width:thin; cursor:grab; touch-action:pan-y; }
  .fac-strip.dragging { scroll-snap-type:none; scroll-behavior:auto;
    cursor:grabbing; }
  .fac-card { flex:0 0 170px; box-sizing:border-box; scroll-snap-align:start;
    text-align:left; padding:4px; text-transform:none; letter-spacing:0.02em;
    font-size:10px; }
  .fac-card:has(.fac-poster) { display:flex; flex-direction:column; gap:4px; }
  .fac-card .fac-poster { width:162px; height:243px; object-fit:cover; }
  .fac-card .sw { display:inline-block; width:10px; height:10px;
    margin-right:5px; vertical-align:middle; border-radius:3px; }
  .fac-card .ident { display:block; font-size:10px; color:#8a94a6;
    text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
  .fac-card .perk { display:block; font-size:9px; color:#6f7a8c;
    margin-top:2px; }
  .fac-arrow { background:#14171d; border:1px solid #2a2f3a; color:#aab4c4;
    border-radius:4px; padding:8px 10px; cursor:pointer; font-size:14px;
    font-family:inherit; flex:none; }
  .fac-arrow:hover { border-color:var(--accent); color:#fff; }
  .fac-arrow:disabled { opacity:0.3; cursor:default; }
  /* compact setup screen (v0.5.1): map + faction + opponents + start fit
     ~one 1080p screen — tighter spacing; v0.7.2: map picker is a compact
     two-row grid (5+4) of thumbnail cards, text-only without the art pack */
  .map-row { display:flex; flex-wrap:wrap; gap:8px; }
  .map-row .menu-btn { flex:0 0 132px; display:flex; flex-direction:column;
    align-items:flex-start; gap:4px; white-space:normal; text-align:left;
    padding:6px; font-size:10px; }
  .map-thumb { display:block; width:110px; height:90px; object-fit:cover;
    border-radius:4px; border:1px solid #3a3418; }
  .map-row .menu-btn.sel .map-thumb { border-color:var(--accent);
    box-shadow:0 0 6px var(--accent-dim); }
  .map-brief { font-size:9px; font-style:italic; color:#8a94a6;
    text-transform:none; letter-spacing:0.02em; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .menu-box h2 { margin:10px 0 4px; }
  .menu-box select { padding:3px 5px; font-size:11px; }
  .fac-btn .sw { display:inline-block; width:12px; height:12px;
    margin-right:6px; vertical-align:middle; border-radius:3px; }
  .fac-btn .ident { display:block; font-size:10px; color:#8a94a6;
    text-transform:uppercase; letter-spacing:0.08em; margin-top:2px; }
  .fac-btn .perk { display:block; font-size:9px; color:#6f7a8c; margin-top:2px; }
  .menu-btn.start { background:rgba(76,175,80,0.15); border-color:#4caf50;
    color:#9f9; font-size:14px; padding:10px 26px; }
  .menu-btn.start:hover { background:rgba(76,175,80,0.28); }
  .menu-box select, .menu-box input { background:#14171d; color:#dfe6f2;
    border:1px solid #2a2f3a; border-radius:4px; padding:5px; font-family:inherit; }
  .menu-box input[type=checkbox] { accent-color:var(--accent); }
  #banner { background:rgba(8,10,13,0.9); }
  #banner .menu-box { background:transparent; border:none; }
  #banner h1 { font-size:52px; text-align:center; margin-top:18vh;
    letter-spacing:0.12em; }
  #banner .menu-row { justify-content:center; }
  #banner.won h1 { color:#7c7; text-shadow:0 0 24px rgba(76,175,80,0.5); }
  #banner.lost h1 { color:#e66; text-shadow:0 0 24px rgba(229,57,53,0.5); }
  /* v0.3.6 end-of-match score table */
  .score-table { margin:0 auto 14px; max-width:520px; font-size:13px; }
  .score-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr;
    gap:4px; padding:3px 8px; color:#dfe6f2; }
  .score-row.six { grid-template-columns:1.6fr 0.8fr 1fr 1fr 0.9fr 0.9fr; }
  .score-row span:not(:first-child) { text-align:right; }
  .score-head { color:#8a94a6; font-size:11px; text-transform:uppercase;
    letter-spacing:0.08em; border-bottom:1px solid #2a2f3a; }
  .score-row.out { color:#7a8290; }

  /* ---- v0.10.0 multiplayer chrome ---- */
  .mp-dot { display:inline-block; width:10px; height:10px; border-radius:50%;
    margin-right:7px; flex:none; border:1px solid rgba(255,255,255,0.35); }
  .mp-slots { display:flex; flex-direction:column; gap:4px; margin:8px 0; }
  .mp-slot-row { display:flex; align-items:center; gap:8px; padding:4px 6px;
    background:rgba(20,23,29,0.6); border:1px solid #2a2f3a; border-radius:5px; }
  .mp-slot-name { min-width:140px; }
  .mp-note { font-size:10px; color:#7d8797; }
  .mp-code-line { font-size:13px; margin:6px 0; }
  .mp-code-big { font-size:22px; letter-spacing:0.35em; color:#ffd76a;
    font-weight:700; }
  .mp-code { width:90px; text-transform:uppercase; letter-spacing:0.3em;
    font-size:15px; text-align:center; }
  .mp-url { min-width:260px; }
  .mp-seed { width:90px; }
  .mp-error { color:#ff8a80; font-size:12px; margin:6px 0; }
  .mp-chatlog { height:110px; overflow-y:auto; background:rgba(10,12,16,0.7);
    border:1px solid #2a2f3a; border-radius:5px; padding:6px 8px;
    font-size:12px; margin-bottom:6px; }
  .mp-chatline { padding:1px 0; color:#cfd6e2; }
  .mp-chatinput { flex:1; }
  #net-status { display:inline-flex; align-items:center; gap:5px;
    font-size:10px; color:#9aa5b5; text-transform:uppercase;
    letter-spacing:0.08em; }
  .net-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .net-dot.good { background:#4caf50; }
  .net-dot.fair { background:#ffb300; }
  .net-dot.poor, .net-dot.down { background:#e53935; }
  #spec-badge { position:fixed; top:44px; left:50%; transform:translateX(-50%);
    z-index:6; background:rgba(30,20,8,0.9); border:1px solid var(--accent);
    color:#ffd76a; padding:4px 16px; border-radius:5px; font-size:11px;
    text-transform:uppercase; letter-spacing:0.2em; }
  #pause-banner { position:fixed; top:44px; left:50%; transform:translateX(-50%);
    z-index:6; background:rgba(12,14,18,0.85); border:1px solid var(--accent-dim);
    color:#dfe6f2; padding:4px 16px; border-radius:5px; font-size:11px;
    text-transform:uppercase; letter-spacing:0.14em; }
  #chat-overlay { position:fixed; left:50%; bottom:120px;
    transform:translateX(-50%); z-index:8; width:min(460px, 80vw);
    background:rgba(12,14,18,0.92); border:1px solid var(--accent-dim);
    border-radius:6px; padding:8px 10px; }
  #chatlog { max-height:120px; overflow-y:auto; font-size:12px;
    margin-bottom:6px; }
  #chatlog .mp-chatline { animation:hb-in 0.2s ease-out; }
  #chatbar { width:100%; box-sizing:border-box; background:#14171d;
    color:#dfe6f2; border:1px solid #2a2f3a; border-radius:4px; padding:6px;
    font-family:inherit; font-size:12px; }

  /* ---- v6 desert-military chrome (Grok terrain/scenario pack skin) ----
     skin only: warm panel fills, gold frames, inset shadows, active-tab
     styling. Behavior classes (.ready/.queued/.placing/.disabled/…) keep
     their own borders — they out-specify the .bb-tile base rule below. */
  #topbar { background:linear-gradient(180deg, #1c1912 0%, #0e0c08 100%);
    border-bottom:2px solid #c8a23a;
    box-shadow:inset 0 -1px 0 #3a3018, 0 4px 16px rgba(0,0,0,0.45); }
  /* v0.9.0: the build bar + selection panel are a touch more transparent
     (0.92 -> 0.78, ~15%) so more of the battlefield reads through them; the
     minimap / army panel keep the solid fill */
  #buildbar, #sel-panel { background:rgba(16,14,10,0.78); border:1px solid #c8a23a;
    box-shadow:0 0 0 1px #2a2410, 0 10px 28px rgba(0,0,0,0.45); }
  #minimap, #army-panel, .panel { background:rgba(16,14,10,0.92);
    border:1px solid #c8a23a;
    box-shadow:0 0 0 1px #2a2410, 0 10px 28px rgba(0,0,0,0.45); }
  .bb-tab.active, .tb-btn.active, .menu-btn.sel {
    background:rgba(200,162,58,0.18); border-color:#c8a23a; color:#fff; }
  .bb-tile { background:#16130c; border-color:#3a3418; }
  /* (Grok's .bb-tile:hover accent rule is not ported: the existing hover
     rule above already uses --accent = #c8a23a, and re-declaring it here
     would override .ready/.queued's behavior borders on hover) */
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="menu-3d"></canvas>
<canvas id="ui-overlay"></canvas>
<div id="topbar"></div>
<div id="buildbar"></div>
<div id="sel-panel"></div>
<div id="army-panel"></div>
<div id="minimap"></div>
<div id="hint"></div>
<div id="briefing" class="hidden"></div>
<div id="alerts"></div>
<div id="cursor-label"></div>
<div id="tooltip"></div>
<div id="tutor" class="hidden"></div>
<div id="spec-badge" class="hidden">Spectating</div>
<div id="pause-banner" class="hidden"></div>
<div id="chat-overlay" class="hidden">
  <div id="chatlog"></div>
  <input id="chatbar" maxlength="140" placeholder="Message — Enter to send, Esc to close">
</div>
<div id="menu"></div>
<div id="banner" class="hidden"></div>
<div id="gfx-toggle">
  <label><input type="checkbox" id="gfx3d" checked> 3D graphics</label>
  <span class="note" id="gfx-note"></span>
</div>
<div id="cinematic">
  <div class="cine-kicker" id="cine-kicker"></div>
  <div class="cine-title" id="cine-title"></div>
  <div class="cine-sub" id="cine-sub"></div>
  <div class="cine-vs" id="cine-vs"></div>
  <div class="cine-skip" id="cine-skip">Click or press any key to skip</div>
</div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
