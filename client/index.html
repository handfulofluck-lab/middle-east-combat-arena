<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070a">
<meta name="description" content="MCA — Middle East Combat Arena. Real-time strategy in the browser.">
<title>MCA — Middle East Combat Arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M22 3.5H42L60.5 22V42L42 60.5H22L3.5 42V22Z' fill='%2305070a' stroke='%23e9b872' stroke-width='3'/%3E%3Cpath d='M17.5 45L32 17.5L46.5 45' fill='none' stroke='%23f3f5f8' stroke-width='5.5'/%3E%3Cpath d='M32 31.5l5 6.25-5 6.25-5-6.25z' fill='%23e9b872'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="in-menu">

<!-- ── world layers ───────────────────────────────────────────────────────
     #menu-backdrop is the dark fallback plate behind the front-end; the live
     WebGL canvas (#gl-canvas, z = --z-world) covers it whenever 3D is up. -->
<div id="menu-backdrop" aria-hidden="true">
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" focusable="false">
    <defs>
      <linearGradient id="bd-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04060a"/>
        <stop offset=".46" stop-color="#0a101a"/>
        <stop offset=".62" stop-color="#1a1820"/>
        <stop offset=".7" stop-color="#2c2018"/>
        <stop offset="1" stop-color="#07090c"/>
      </linearGradient>
      <radialGradient id="bd-glow" cx="1330" cy="705" r="760" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e9b872" stop-opacity=".42"/>
        <stop offset=".28" stop-color="#c98a45" stop-opacity=".16"/>
        <stop offset="1" stop-color="#c98a45" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bd-d1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b1712"/><stop offset="1" stop-color="#0b0c0f"/>
      </linearGradient>
      <linearGradient id="bd-d2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#12110f"/><stop offset="1" stop-color="#07080a"/>
      </linearGradient>
      <linearGradient id="bd-rim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#e9b872" stop-opacity="0"/>
        <stop offset=".62" stop-color="#e9b872" stop-opacity=".5"/>
        <stop offset="1" stop-color="#e9b872" stop-opacity=".08"/>
      </linearGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#bd-sky)"/>
    <g fill="#dfe8f5">
      <circle cx="212" cy="96" r="1.2" opacity=".5"/><circle cx="388" cy="212" r=".9" opacity=".35"/>
      <circle cx="560" cy="64" r="1.1" opacity=".45"/><circle cx="702" cy="268" r=".8" opacity=".3"/>
      <circle cx="846" cy="132" r="1.3" opacity=".5"/><circle cx="1010" cy="52" r=".9" opacity=".4"/>
      <circle cx="1124" cy="226" r="1" opacity=".35"/><circle cx="1288" cy="108" r="1.4" opacity=".55"/>
      <circle cx="1452" cy="188" r=".9" opacity=".35"/><circle cx="1586" cy="72" r="1.1" opacity=".45"/>
      <circle cx="1716" cy="242" r="1" opacity=".3"/><circle cx="1834" cy="126" r="1.2" opacity=".45"/>
      <circle cx="94" cy="318" r=".9" opacity=".25"/><circle cx="1668" cy="372" r=".8" opacity=".22"/>
      <circle cx="930" cy="352" r=".8" opacity=".22"/><circle cx="1228" cy="402" r=".7" opacity=".18"/>
    </g>
    <rect width="1920" height="1080" fill="url(#bd-glow)"/>
    <path d="M0 742C210 690 380 716 590 700S960 628 1180 664 1560 716 1920 668V1080H0Z" fill="url(#bd-d1)"/>
    <path d="M0 742C210 690 380 716 590 700S960 628 1180 664 1560 716 1920 668" fill="none" stroke="url(#bd-rim)" stroke-width="1.6"/>
    <path d="M0 842C260 800 470 870 760 812S1240 760 1500 822 1780 842 1920 800V1080H0Z" fill="url(#bd-d2)"/>
    <path d="M0 842C260 800 470 870 760 812S1240 760 1500 822 1780 842 1920 800" fill="none" stroke="url(#bd-rim)" stroke-width="1" opacity=".5"/>
    <path d="M0 960C320 900 640 990 980 936S1620 900 1920 950V1080H0Z" fill="#050608"/>
  </svg>
  <div class="bd-grid"></div>
</div>
<canvas id="game"></canvas>
<canvas id="ui-overlay"></canvas>

<!-- ── in-match HUD (hidden while body.in-menu) ───────────────────────────
     Layout containers ignore the pointer; only real panels take input. -->
<div id="hud">
  <div id="topbar"></div>
  <div id="hud-topcenter">
    <div id="spec-badge" class="hidden">Spectating</div>
    <div id="pause-banner" class="hidden"></div>
    <div id="tutor" class="hidden"></div>
    <div id="hint"></div>
  </div>
  <div id="alerts" role="log" aria-live="polite"></div>
  <div id="hud-left">
    <div id="army-panel"></div>
    <div id="minimap"></div>
  </div>
  <div id="sel-panel"></div>
  <div id="buildbar"></div>
  <div id="chat-overlay" class="hidden">
    <div id="chatlog"></div>
    <input id="chatbar" maxlength="140" autocomplete="off" spellcheck="false"
      placeholder="Message — Enter to send, Esc to close" aria-label="Chat message">
  </div>
  <div id="chat-feed" aria-live="polite"></div>
</div>
<div id="cursor-label"></div>
<div id="tooltip" role="tooltip"></div>

<!-- ── full-screen plates ─────────────────────────────────────────────── -->
<div id="briefing" class="hidden"></div>
<div id="menu" class="hidden"></div>
<div id="banner" class="hidden"></div>
<div id="toasts" aria-live="polite"></div>
<div id="store-root"></div>

<!-- ── legacy hook kept for main.js: the 3D on/off checkbox is surfaced
     through Settings › Graphics and driven by proxy. -->
<div id="gfx-toggle" hidden>
  <label><input type="checkbox" id="gfx3d" checked tabindex="-1"> 3D graphics</label>
  <span class="note" id="gfx-note"></span>
</div>

<script src="./config.js"></script>
<!-- LEGACY-THREE --><script src="vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
