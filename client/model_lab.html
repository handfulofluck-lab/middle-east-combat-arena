<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCA — Model Lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cdbf9f; font: 12px/1.3 system-ui, sans-serif; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center; color: #1b1a17;
         background: rgba(255, 250, 235, 0.72); border-radius: 3px; padding: 1px 5px; font-size: 11px; }
  .lbl b { font-weight: 700; }
  .lbl i { font-style: normal; opacity: 0.7; }
  #hud { position: fixed; left: 8px; top: 8px; color: #1b1a17; background: rgba(255, 250, 235, 0.8); padding: 6px 9px;
         border-radius: 4px; max-width: 60vw; }
  #hud a { color: #114; margin-right: 8px; }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud"></div>
<script type="module" src="./src/gfx/model_lab.js"></script>
</body>
</html>
